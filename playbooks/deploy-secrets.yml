---
# deploy-secrets.yml — Run from YOUR machine with vault access
# Usage: ansible-playbook deploy-secrets.yml -i localhost, --ask-vault-pass
- name: Deploy secrets to device
  hosts: localhost
  connection: local
  become: yes
  gather_facts: yes

  tasks:
    - name: Ensure /etc/orion directory exists
      file:
        path: /etc/orion
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Write decrypted secrets to device
      copy:
        content: |
          ---
          # Deployed by deploy-secrets.yml on {{ ansible_date_time.iso8601 }}
          # DO NOT EDIT — re-run deploy-secrets.yml to update
          tailscale_oauth_client_id: "{{ vault_tailscale_oauth_client_id }}"
          tailscale_oauth_client_secret: "{{ vault_tailscale_oauth_client_secret }}"
          influxdb_admin_password: "{{ vault_influxdb_admin_password }}"
          influxdb_admin_token: "{{ vault_influxdb_admin_token }}"
          grafana_admin_password: "{{ vault_grafana_admin_password }}"
        dest: /etc/orion/secrets.yml
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Verify secrets written
      stat:
        path: /etc/orion/secrets.yml
      register: result

    - name: Confirm
      debug:
        msg: "Secrets deployed ({{ result.stat.size }} bytes, mode {{ result.stat.mode }})"
