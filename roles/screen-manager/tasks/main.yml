---
- name: Ensure dependencies installed
  apt:
    name:
      - git
      - python3-pip
      - python3-dev
      - pkg-config
      - libsystemd-dev
    state: present
    update_cache: yes

- name: Check if screen-manager directory exists
  stat:
    path: "{{ app_dir }}"
  register: screen_manager_dir

- name: Clone Screen Manager repo if it doesn't exist
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: development
    force: yes
  when: not screen_manager_dir.stat.exists
  register: git_clone

- name: Log update status
  debug:
    msg: "Screen Manager status: {{ update_status.stdout | default('Newly installed') }}"
  when: screen_manager_dir.stat.exists

- name: Ensure logs directory exists
  file:
    path: "{{ app_dir }}/logs"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Create logs .gitkeep file
  copy:
    content: ""
    dest: "{{ app_dir }}/logs/.gitkeep"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'
    force: no

- name: Check if requirements.txt exists
  stat:
    path: "{{ app_dir }}/requirements.txt"
  register: requirements_file

- name: Install Python dependencies if requirements exists
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    executable: pip3
  when: requirements_file.stat.exists
  ignore_errors: yes

- name: Fix ownership to prevent git permission issues
  file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    recurse: yes

- name: Install systemd service file for screen
  copy:
    src: screen.service
    dest: /etc/systemd/system/screen.service
    owner: root
    group: root
    mode: '0644'
  register: service_file

- name: Reload systemd if service file changed
  systemd:
    daemon_reload: yes
  when: service_file is changed

- name: Enable and start screen service
  systemd:
    name: screen.service
    enabled: yes
    state: started

- name: Restart screen service only if service file changed
  systemd:
    name: screen.service
    state: restarted
  when: service_file is changed

- name: Ensure orion state directory exists
  file:
    path: /var/lib/orion
    state: directory
    owner: root
    mode: '0755'

- name: Ensure orion-update.log exists
  file:
    path: /var/log/orion-update.log
    state: touch
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0664'
  changed_when: false

- name: Deploy auto-update script
  copy:
    src: orion-auto-update.sh
    dest: /usr/local/bin/orion-auto-update.sh
    owner: root
    group: root
    mode: '0755'

- name: Schedule auto-update cron (daily 03:00)
  copy:
    content: |
      SHELL=/bin/bash
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Orion auto-update — fires if remote commit is >= 5 days old
      0 3 * * * root /usr/local/bin/orion-auto-update.sh
    dest: /etc/cron.d/orion-auto-update
    owner: root
    group: root
    mode: '0644'

- name: Logrotate for orion-update.log
  copy:
    content: |
      /var/log/orion-update.log {
          weekly
          rotate 12
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    dest: /etc/logrotate.d/orion-update
    owner: root
    group: root
    mode: '0644'